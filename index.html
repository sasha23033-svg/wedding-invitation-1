<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення на весілля</title>
    <!-- Підключаємо гарні класичні шрифти з Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #2b3a30; /* Темно-зелений колір як на фото */
            --accent-gold: #c6a267; /* Золотистий колір печатки */
            --text-color: #e6e8e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 430px; /* Спеціально під екран смартфона */
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        .header-title {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        .main-title {
            font-size: 2.8rem;
            font-style: italic;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Стилізація конверта / печатки */
        .envelope-zone {
            position: relative;
            margin: 40px auto;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wax-seal {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 35%, #d4af37, #996515);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .wax-seal:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        .wax-seal-text {
            color: #3d2b0f;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0.5px 0.5px 0px rgba(255,255,255,0.2);
        }

        .subtitle {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-top: 30px;
            font-weight: 300;
            opacity: 0.9;
        }

        /* Прихована секція з деталями весілля */
        .wedding-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 1s ease-in-out, opacity 1s ease-in-out;
            opacity: 0;
            margin-top: 20px;
        }

        .wedding-details.open {
            max-height: 1000px;
            opacity: 1;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            margin: 30px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Ви запрошені</div>
        <div class="main-title">на весілля</div>

        <div class="envelope-zone">
            <div class="wax-seal" id="sealBtn">
                <span class="wax-seal-text">ВІДКРИЙ</span>
            </div>
        </div>

        <p class="subtitle">
            Цей день особливий для нас, і ми хочемо розділити його з тими, хто справді близький серцю.
        </p>

        <!-- Ця частина відкриється при натисканні на печатку -->
        <div class="wedding-details" id="details">
            <div class="divider"></div>
            <h2>Іван & Анна</h2>
            <p style="margin-top: 15px; font-size: 1.4rem;">24 Серпня 2026</p>
            <p style="margin-top: 10px;">о 16:00</p>
            <p style="margin-top: 20px; font-style: italic;">Ресторан "Grand Hall", м. Київ</p>
        </div>
    </div>

    <!-- Аудіо для фонової музики (замініть link/файл на свій) -->
    <audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        const sealBtn = document.getElementById('sealBtn');
        const details = document.getElementById('details');
        const bgMusic = document.getElementById('bgMusic');

        sealBtn.addEventListener('click', () => {
            // Вмикаємо музику
            bgMusic.play().catch(e => console.log("Music play blocked: ", e));
            
            // Відкриваємо деталі
            details.classList.toggle('open');
            
            // Легка анімація натискання
            sealBtn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                sealBtn.style.transform = 'scale(1)';
            }, 150);
        });
    </script>
</body>
</html>
